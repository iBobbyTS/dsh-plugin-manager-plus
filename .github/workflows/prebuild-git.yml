name: Commit prebuilt GitHub plugin

# GitHub installs use the committed lib/ and client/ files, not install-time builds.
# Build artifacts and removal of install-time lifecycle scripts are committed
# together, only AFTER typechecks, tests and the client loader preflight pass.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prebuild-git.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'tsdown.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'cordis.patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prebuild-git-main
  cancel-in-progress: false

jobs:
  build-and-commit:
    if: github.repository == 'iBobbyTS/dsh-plugin-manager-plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Typecheck, build and smoke test
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Verify generated plugin artifacts
        run: |
          node scripts/preflight.mjs
          node --input-type=module -e "import {existsSync} from 'node:fs'; if (!existsSync('lib/index.js') || !existsSync('lib/types/index.d.ts') || !existsSync('client/client.js')) process.exit(1)"
      - name: Stage prebuilt release (without install-time build scripts)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          delete pkg.scripts.prepare
          delete pkg.scripts.prepack
          pkg.scripts.prepublishOnly = 'npm run build && node scripts/preflight.mjs'
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          git add package.json
          git add -f lib/ client/
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if ('prepare' in pkg.scripts || 'prepack' in pkg.scripts) throw new Error('Git installation still triggers a build')
          if (!existsSync(pkg.main) || !existsSync(pkg.exports['./client'])) throw new Error('Missing installable artifacts')
          NODE
      - name: Commit generated artifacts to main
        run: |
          if git diff --cached --quiet; then
            echo "Generated artifacts already match main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: check in precompiled GitHub-installable plugin"
          git push origin HEAD:main
